# Local development database only. Credentials match BE/.env.example.
# Host port 55432 avoids clashing with a local PostgreSQL or an SSH tunnel on 5432/5433.
services:
  postgres:
    image: postgres:16-alpine
    container_name: community-events-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: community_events_board
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d community_events_board"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
